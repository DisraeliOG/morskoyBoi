<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="card p-4">
        <h2 class="text-center">🚪 Вход в систему</h2>

        <div *ngIf="errorMessage" class="alert alert-danger" role="alert">
          {{ errorMessage }}
        </div>

        <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">

          <div class="mb-3">
            <label for="email" class="form-label">Email</label>
            <input
              id="email"
              formControlName="email"
              type="email"
              class="form-control"
              [ngClass]="{'is-invalid': loginForm.get('email')?.invalid && loginForm.get('email')?.touched}">

            <div *ngIf="loginForm.get('email')?.touched" class="invalid-feedback">
              <div *ngIf="loginForm.get('email')?.errors?.['required']">Email обязателен.</div>
              <div *ngIf="loginForm.get('email')?.errors?.['email']">Некорректный формат email.</div>
            </div>
          </div>

          <div class="mb-3">
            <label for="password" class="form-label">Пароль</label>
            <input
              id="password"
              formControlName="password"
              type="password"
              class="form-control"
              [ngClass]="{'is-invalid': loginForm.get('password')?.invalid && loginForm.get('password')?.touched}">

            <div *ngIf="loginForm.get('password')?.touched" class="invalid-feedback">
              <div *ngIf="loginForm.get('password')?.errors?.['required']">Пароль обязателен.</div>
              <div *ngIf="loginForm.get('password')?.errors?.['minlength']">Пароль должен быть не менее 3 символов.</div>
            </div>
          </div>

          <button type="submit" [disabled]="loginForm.invalid || isLoading" class="btn btn-primary w-100">
            <span *ngIf="isLoading">Вход...</span>
            <span *ngIf="!isLoading">Войти</span>
          </button>
        </form>

        <p class="mt-3 text-center">
          Нет аккаунта? <a routerLink="/register">Зарегистрироваться</a>
        </p>
      </div>
    </div>
  </div>
</div>
